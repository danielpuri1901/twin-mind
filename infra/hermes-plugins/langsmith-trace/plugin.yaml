name: langsmith-trace
version: "0.1.0"
description: "Traces Hermes conversations (one run per turn + nested tool calls) to LangSmith. First-party, opt-in, fail-open. Threads by Hermes session id."
author: twin-mind
requires_env:
  - LANGSMITH_API_KEY
hooks:
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
