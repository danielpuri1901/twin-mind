# Twin Mind - box configuration (deployed to ~/.hermes/config.yaml on the EC2 box)
# Differences from the Mac (deliberate, documented):
#   terminal.backend: docker  (the sandbox the Mac couldn't have - plan Task 12)
#   stt.enabled: false        (2GB box can't run local whisper; voice transcription
#                              returns when a Groq key is added: stt.provider: groq)
# Inference: the Anthropic API since 2026-10-22; the anthropic-key plugin supplies
# ANTHROPIC_API_KEY from AWS Secrets Manager at startup. Embeddings stay on Bedrock.
model:
  default: claude-sonnet-4-6
  provider: anthropic
auxiliary:
  compression:
    model: claude-haiku-4-5
    provider: anthropic
approvals:
  mode: manual
  cron_mode: deny
terminal:
  backend: docker
  docker_image: python:3.11-slim
stt:
  enabled: false
web:
  search_backend: tavily
  extract_backend: firecrawl
plugins:
  enabled:
    - anthropic-key
    - observability/langfuse
  disabled: []
mcp_servers:
  notion:
    url: https://mcp.notion.com/mcp
    auth: oauth
