# Twin Mind - box configuration (deployed to ~/.hermes/config.yaml on the EC2 box)
# Differences from the Mac (deliberate, documented):
#   terminal.backend: docker  (the sandbox the Mac couldn't have - plan Task 12)
#   stt.enabled: false        (2GB box can't run local whisper; voice transcription
#                              returns when a Groq key is added: stt.provider: groq)
# Inference: the Anthropic API since 2026-10-22; the anthropic-key plugin supplies
# ANTHROPIC_API_KEY from AWS Secrets Manager at startup. Embeddings stay on Bedrock.
model:
  default: claude-sonnet-5-5
  provider: anthropic
# Hermes lists Sonnet 4.6 and 5.5 with a 1M-token window, so the default
# threshold (0.50) waits until 500k tokens before it compacts. 0.15 compacts at
# about 150k, the default trigger of Anthropic's own server-side compaction. It
# is the overflow backstop; the daily session reset keeps everyday calls small.
compression:
  threshold: 0.15
auxiliary:
  compression:
    model: claude-haiku-4-5
    provider: anthropic
approvals:
  mode: manual
  cron_mode: deny
terminal:
  backend: docker
  docker_image: python:3.11-slim
stt:
  enabled: false
web:
  search_backend: tavily
  extract_backend: firecrawl
plugins:
  enabled:
    - anthropic-key
    - observability/langfuse
  disabled: []
# No MCP servers. Notion was removed on 2026-10-23: unused since 2026-09-28, and its
# 69 tool definitions cost about 86k input tokens on every call.
