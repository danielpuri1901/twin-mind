name: check-images

# Builds the image up to its test stage on every pull request, with no AWS sign-in and no push,
# so a broken Dockerfile or a failing test shows up before a change reaches main.

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
